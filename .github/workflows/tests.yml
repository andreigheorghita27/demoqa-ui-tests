name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Weekly as well: the site is public and can change, and new advisories are published
  # against dependencies that have not changed.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies and Chromium
        run: |
          pip install -r requirements.txt pip-audit
          python -m playwright install --with-deps chromium

      # Fails at once on a known advisory. Retries only when the advisory service could not be
      # reached, i.e. when the output has no findings in it.
      - name: Audit dependencies
        run: |
          for attempt in 1 2 3; do
            if pip-audit -r requirements.txt > audit.log 2>&1; then cat audit.log; exit 0; fi
            cat audit.log
            if grep -q "known vulnerabilit" audit.log; then exit 1; fi
            echo "Advisory service not reachable, retrying ($attempt/3)"
            sleep 20
          done
          exit 1

      - name: Run tests
        env:
          HEADLESS: "True"
        run: behave

      # JUnit results and screenshots of failed steps, to see what went wrong.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
          if-no-files-found: ignore
