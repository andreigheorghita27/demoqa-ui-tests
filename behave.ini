[behave]
paths = features
show_skipped = false
show_timings = true
# Scenarios that fail because of a bug listed in docs/known-bugs.md are tagged @known_bug and
# skipped by default, so a red run always means something new broke.
# Run them on their own with: behave --tags=@known_bug
default_tags = not @known_bug
# A JUnit report per feature in reports/junit, kept also when the console output is lost.
junit = true
junit_directory = reports/junit
